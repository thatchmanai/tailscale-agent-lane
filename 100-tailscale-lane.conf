# Tailscale SSH lane for an AI agent - key-only sign-in.
# Install on the hub Mac as: /etc/ssh/sshd_config.d/100-tailscale-lane.conf
# The agent's key is further bound by its from= address in authorized_keys.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
# No forwarding or tunneling: the key opens a shell on this machine only.
AllowTcpForwarding no
PermitTunnel no
AllowAgentForwarding no
X11Forwarding no
